---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
  namespace: grafana-operator
spec:
  interval: 5m
  dependsOn:
    - name: repos
  sourceRef:
    kind: GitRepository
    name: flux-lib
  path: ./apps/grafana-operator/5.22.x
  prune: false
  wait: true
  timeout: 20m
  retryInterval: 5m
